# Local test harness for the acmebot container (see CONTEXT.md).
#
# Usage:
#   cp .env.acmebot.example .env.acmebot   # fill in ACME_DOMAINS / ACME_EMAIL
#   docker compose build
#   docker compose run --rm bootstrap      # one-time: register account + print .env block
#   # ... paste the printed block into .env.acmebot, publish the TXT record(s), then:
#   docker compose run --rm acmebot        # issue/renew (+ import into Key Vault if AZ_KV_NAME is set)
#
# To just get an interactive shell inside the built image (no cert issuance):
#   docker compose run --rm debug
#
# The container's default ENTRYPOINT is acme.sh itself (see Dockerfile); the
# `bootstrap` and `acmebot` services below select the two purpose-built
# alternate entrypoints, acme-bootstrap.sh and acme-cron-update.sh, which
# validate their own required env vars (ACME_DOMAINS, ACME_EMAIL) and fail
# with a clear error if missing — see .env.acmebot.example for the full
# list, including the optional AZ_KV_NAME/AZ_KV_CERT_NAME (Key Vault import
# is skipped, Phase 1 local-folder-only, if AZ_KV_NAME is empty/unset).
#
# env_file is .env.acmebot (not .env): the repo root's .env already holds an
# unrelated GH_TOKEN for other tooling, so it's kept separate here.
#
# env_file is marked `required: false` on all services: this lets `docker
# compose run --rm debug` (or `bootstrap`) work even before .env.acmebot
# exists (compose resolves every service's config up front, so a missing
# *required* env_file on any service — even one you're not running — would
# otherwise abort the whole command).
#
# No volume backs ACME_HOME here (deliberately, matching README.md's plain
# `docker run` examples): `bootstrap` prints the Account key as
# ACME_ID_SECRET_KEY in its `.env` block, and `acmebot` writes that env var to
# ACME_HOME/account.key at startup, so state only ever lives in
# .env.acmebot — nothing container-side needs to persist between runs.
#
# `./out/certs` is a bind mount (not a named volume) so issued certs are
# easy to inspect locally without `docker compose exec`/`cp`.
#
# `debug`: same image/env as `acmebot`, but overrides the entrypoint with an
# interactive bash shell for poking around inside the container (e.g.
# checking acme.sh/az versions, inspecting /acme.cert.store).
services:
  bootstrap:
    build:
      context: ./acme-app
      dockerfile: Dockerfile
    image: acmebot:local
    entrypoint: ["/home/app/acme-bootstrap.sh"]
    env_file:
      - path: .env.acmebot
        required: false

  acmebot:
    build:
      context: ./acme-app
      dockerfile: Dockerfile
    image: acmebot:local
    entrypoint: ["/home/app/acme-cron-update.sh"]
    env_file:
      - path: .env.acmebot
        required: false
    volumes:
      - ./out/certs:/certs

  debug:
    build:
      context: ./acme-app
      dockerfile: Dockerfile
    image: acmebot:local
    entrypoint: ["/bin/bash"]
    tty: true
    stdin_open: true
    env_file:
      - path: .env.acmebot
        required: false
    volumes:
      - ./out/certs:/certs
