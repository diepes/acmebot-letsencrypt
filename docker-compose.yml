# Local test harness for the acmebot container (see CONTEXT.md).
#
# Usage:
#   cp .env.acmebot.example .env.acmebot   # fill in ACME_DOMAINS / ACME_EMAIL / AZURE_KEYVAULT_NAME
#   docker compose build
#   docker compose run --rm bootstrap      # one-time: register account + print TXT record(s)
#   # ... publish the printed TXT record(s) at your DNS provider, then:
#   docker compose run --rm acmebot        # issue/renew + import into Key Vault
#
# To just get an interactive shell inside the built image (no cert issuance):
#   docker compose run --rm debug
#
# The container's default ENTRYPOINT is acme.sh itself (see Dockerfile); the
# `bootstrap` and `acmebot` services below select the two purpose-built
# alternate entrypoints, acme-bootstrap.sh and acme-cron-update.sh, which
# validate their own required env vars (ACME_DOMAINS, ACME_EMAIL,
# AZURE_KEYVAULT_NAME) and fail with a clear error if missing — see
# .env.acmebot.example for the full list.
#
# env_file is .env.acmebot (not .env): the repo root's .env already holds an
# unrelated GH_TOKEN for other tooling, so it's kept separate here.
#
# env_file is marked `required: false` on all services: this lets `docker
# compose run --rm debug` (or `bootstrap`) work even before .env.acmebot
# exists (compose resolves every service's config up front, so a missing
# *required* env_file on any service — even one you're not running — would
# otherwise abort the whole command).
#
# The acme-cert-store volume persists the ACME Account key + per-domain
# renewal state across runs (mounted at /acme.cert.store, see Dockerfile).
# Losing it means re-registering a new ACME account and re-publishing new
# Persist TXT records for every domain.
#
# `./out/certs` is a bind mount (not a named volume) so issued certs are
# easy to inspect locally without `docker compose exec`/`cp`.
#
# `debug`: same image/volumes as `acmebot`, but overrides the entrypoint
# with an interactive bash shell for poking around inside the container
# (e.g. checking acme.sh/az versions, inspecting /acme.cert.store).
services:
  bootstrap:
    build:
      context: ./acme-app
      dockerfile: Dockerfile
    image: acmebot:local
    entrypoint: ["/home/app/acme-bootstrap.sh"]
    env_file:
      - path: .env.acmebot
        required: false
    volumes:
      - acme-cert-store:/acme.cert.store

  acmebot:
    build:
      context: ./acme-app
      dockerfile: Dockerfile
    image: acmebot:local
    entrypoint: ["/home/app/acme-cron-update.sh"]
    env_file:
      - path: .env.acmebot
        required: false
    volumes:
      - acme-cert-store:/acme.cert.store
      - ./out/certs:/certs

  debug:
    build:
      context: ./acme-app
      dockerfile: Dockerfile
    image: acmebot:local
    entrypoint: ["/bin/bash"]
    tty: true
    stdin_open: true
    env_file:
      - path: .env.acmebot
        required: false
    volumes:
      - acme-cert-store:/acme.cert.store
      - ./out/certs:/certs

volumes:
  acme-cert-store:
