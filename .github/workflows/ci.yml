name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  DOTNET_VERSION: 10.0.x
  NODE_VERSION: 24.x
  PEBBLE_VERSION: 2.10.1

permissions: {}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build backend
        run: |
          dotnet restore ./Acmebot.slnx
          dotnet format --verify-no-changes --verbosity detailed --no-restore ./Acmebot.slnx
          dotnet build -c Release --no-restore ./Acmebot.slnx

      - name: Test backend
        run: dotnet test -c Release --no-build --no-restore ./Acmebot.slnx

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/Acmebot.App/ClientApp/package-lock.json

      - name: Build dashboard
        working-directory: ./src/Acmebot.App/ClientApp
        run: |
          npm ci
          npm run lint
          npm run build

  acme-tests:
    name: ACME client tests (Rust, Pebble)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Run mocked tests + Pebble contract test
        env:
          PEBBLE_VERSION: ${{ env.PEBBLE_VERSION }}
        run: ./scripts/ci/pebble-acme-test.sh

  build:
    name: CI result
    if: ${{ always() }}
    needs: [backend, dashboard, acme-tests]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check required jobs
        run: |
          if [ "${{ needs.backend.result }}" != "success" ] || [ "${{ needs.dashboard.result }}" != "success" ] || [ "${{ needs.acme-tests.result }}" != "success" ]; then
            exit 1
          fi
