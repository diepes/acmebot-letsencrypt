name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  PEBBLE_VERSION: 2.10.1

permissions: {}

jobs:
  acme-tests:
    name: ACME client tests (Rust, Pebble)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Run mocked tests + Pebble contract test
        env:
          PEBBLE_VERSION: ${{ env.PEBBLE_VERSION }}
        run: ./scripts/ci/pebble-acme-test.sh
